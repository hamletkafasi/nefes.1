<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully handle iframe Vite WebSocket disconnect events
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          ((e.reason.message && e.reason.message.includes('WebSocket')) ||
            (typeof e.reason === 'string' && e.reason.includes('WebSocket')) ||
            (e.reason.stack && (e.reason.stack.includes('@vite/client') || e.reason.stack.includes('WebSocket'))))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          (e.message && e.message.includes('WebSocket')) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>Nefes - Sigarayı Bırakma & Akciğer Simülasyonu</title>
    <meta name="description" content="Sigarayı bırakma takipçisi, bilimsel canlı akciğer simülasyonu, tasarruf ve sağlık kilometre taşları." />
    <meta property="og:title" content="Nefes - Sigarayı Bırakma & Akciğer Simülasyonu" />
    <meta property="og:description" content="Sigarayı bırakma takipçisi, bilimsel canlı akciğer simülasyonu, tasarruf ve sağlık kilometre taşları." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
